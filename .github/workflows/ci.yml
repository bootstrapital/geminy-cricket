name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Make check
        env:
          BUNDLE_AUDIT_STRICT: "true"
        run: make check

      - name: Build gem
        run: gem build geminy-cricket.gemspec
