name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DuckDB
        run: |
          DUCKDB_VERSION=v1.4.3
          curl -L -o libduckdb.zip https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/libduckdb-linux-amd64.zip
          unzip libduckdb.zip
          sudo mv libduckdb.so /usr/local/lib/libduckdb.so
          sudo mv duckdb.h /usr/local/include/duckdb.h
          sudo mv duckdb.hpp /usr/local/include/duckdb.hpp
          sudo ldconfig

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Make check
        env:
          BUNDLE_AUDIT_STRICT: "true"
        run: make check

      - name: Build gem
        run: gem build geminy-cricket.gemspec
